name: Generate Tide/Current Index

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tide-current/**'
      - 'scripts/requirements-index.txt'
  schedule:
    - cron: '0 6 * * 0'   # weekly Sunday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-indexes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate tide-current-index.json
        run: python scripts/tide-current/generate_index.py --output-dir .

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update tide-current-index.json"
          file_pattern: tide-current-index.json

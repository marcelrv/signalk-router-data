name: Generate CMEMS IBI Current GRIB2 Files

on:
  schedule:
    # Once daily — the anfc dataset updates ~14:00 UTC (per the Copernicus
    # Marine product page), unlike NOS OFS's multiple daily model cycles.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibi-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q copernicusmarine numpy xarray netCDF4 eccodes

      # continue-on-error: a region that fails to generate must not block the
      # upload of the regions that succeeded — the job is failed explicitly by
      # the final step instead, so stale assets still turn CI red.
      - name: Generate IBI GRIB2 files
        id: generate
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python scripts/tide-current/generate_ibi_gribs.py \
            --output-dir ./ibi-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./ibi-gribs/

      # Built before the upload so a release created on the first run gets
      # the full notes (attribution included) even if a later upload fails.
      - name: Generate release notes
        run: python scripts/tide-current/currents_release_notes.py ibi > /tmp/ibi_notes.md

      # Read the download counts before the upload replaces the files (a
      # replaced asset restarts at 0) and add them to download-stats.json
      # in the release. Never blocks the upload.
      - name: Record download counts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_download_stats.py ibi-currents-latest

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each file is uploaded under a temporary name and swapped in, so a
          # failed upload never removes the live file (`--clobber` deletes the
          # old asset first). Per-file isolation; exit 1 if any file failed.
          python3 scripts/release_upload.py ibi-currents-latest ./ibi-gribs/*.grb2 \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — Iberia/Biscay (Copernicus Marine CMEMS IBI)" \
            --notes-file /tmp/ibi_notes.md

      # Regenerated from sources/ REGIONS every run so the region table
      # (files, coverage, resolution, horizons) never drifts from what the
      # pipeline actually produces — adding a region updates the release
      # page automatically.
      - name: Update release notes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit ibi-currents-latest \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — Iberia/Biscay (Copernicus Marine CMEMS IBI)" \
            --notes-file /tmp/ibi_notes.md

      - name: Fail if any region failed to generate
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::One or more regions failed to generate (see the 'Generate IBI GRIB2 files' step log). Regions that did generate were still uploaded."
          exit 1

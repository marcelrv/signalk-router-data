name: Generate OFS Current GRIB2 Files

on:
  schedule:
    - cron: '30 5 * * *'   # daily 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ofs-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q numpy xarray netCDF4 eccodes

      - name: Generate OFS GRIB2 files
        run: |
          python scripts/tide-current/generate_ofs_gribs.py \
            --output-dir ./ofs-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./ofs-gribs/

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per-file isolation: a failed upload must not block the remaining
          # regions' uploads (each asset is independent) — collect failures
          # and fail the job at the END instead of aborting mid-loop.
          failed=0
          for f in ./ofs-gribs/*.grb2; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            gh release upload ofs-currents-latest "$f" \
              --clobber \
              --repo "${{ github.repository }}" \
              2>/tmp/gh_upload_err.txt || {
                if grep -qi "release not found" /tmp/gh_upload_err.txt; then
                  echo "Release does not exist — creating..."
                  gh release create ofs-currents-latest "$f" \
                    --repo "${{ github.repository }}" \
                    --title "Surface Current Forecasts — US Waters (NOAA OFS)" \
                    --notes "Rolling data release: gridded surface current forecasts for US waters, regenerated daily from NOAA NOS Operational Forecast System (OFS) model guidance (https://tidesandcurrents.noaa.gov/ofs/) — surface u/v only, subsampled and re-encoded as compact GRIB2. Assets are overwritten in place each run; download URLs are stable. NOAA data is public domain (U.S. Government work); these repackaged files are NOT an official NOAA product and are not endorsed by NOAA — do not use for primary navigation. Consumed by the signalk-tidal-currents plugin via tide-current-index.json." \
                    --latest=false
                else
                  echo "Upload FAILED for $(basename $f):"
                  cat /tmp/gh_upload_err.txt
                  failed=1
                fi
              }
          done
          exit $failed

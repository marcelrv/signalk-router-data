name: Generate OFS Current GRIB2 Files

on:
  schedule:
    # 4x daily, staggered against the NOAA OFS cycle times: catches the
    # 03/09/15/21Z models ~2.5 h after publication and the 00/06/12/18Z
    # CBOFS cycles ~5.5 h after. Release assets are overwritten in place,
    # so a higher cadence adds no repo growth and no extra commits.
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ofs-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q numpy xarray netCDF4 eccodes scipy fsspec aiohttp h5netcdf h5py

      # continue-on-error: a model that fails to generate must not block the
      # upload of the models that succeeded — the job is failed explicitly by
      # the final step instead, so stale assets still turn CI red.
      - name: Generate OFS GRIB2 files
        id: generate
        continue-on-error: true
        run: |
          python scripts/tide-current/generate_ofs_gribs.py \
            --output-dir ./ofs-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./ofs-gribs/

      # Read the download counts before the upload replaces the files (a
      # replaced asset restarts at 0) and add them to download-stats.json
      # in the release. Never blocks the upload.
      - name: Record download counts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_download_stats.py ofs-currents-latest

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each file is uploaded under a temporary name and swapped in, so a
          # failed upload never removes the live file (`--clobber` deletes the
          # old asset first). Per-file isolation; exit 1 if any file failed.
          python3 scripts/release_upload.py ofs-currents-latest ./ofs-gribs/*.grb2 \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — US Waters (NOAA OFS)" \
            --notes "(placeholder — the region table is filled in by the 'Update release notes' step below)"

      # Regenerated from sources/nos_ofs.py MODELS every run so the region
      # table (files, coverage, resolution, horizons) never drifts from
      # what the pipeline actually produces — adding a model updates the
      # release page automatically.
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/tide-current/ofs_release_notes.py > /tmp/ofs_notes.md
          gh release edit ofs-currents-latest \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — US Waters (NOAA OFS)" \
            --notes-file /tmp/ofs_notes.md

      - name: Fail if any model failed to generate
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::One or more OFS models failed to generate (see the 'Generate OFS GRIB2 files' step log). Models that did generate were still uploaded."
          exit 1

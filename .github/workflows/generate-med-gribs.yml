name: Generate CMEMS MED Current GRIB2 Files

on:
  schedule:
    # Once daily — the anfc dataset updates ~16:00 UTC (per the Copernicus
    # Marine product page).
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: med-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q copernicusmarine numpy xarray netCDF4 eccodes

      # continue-on-error: a region that fails to generate must not block the
      # upload of the regions that succeeded — the job is failed explicitly by
      # the final step instead, so stale assets still turn CI red.
      - name: Generate MED GRIB2 files
        id: generate
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python scripts/tide-current/generate_med_gribs.py \
            --output-dir ./med-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./med-gribs/

      # Built before the upload so a release created on the first run gets
      # the full notes (attribution included) even if a later upload fails.
      - name: Generate release notes
        run: python scripts/tide-current/currents_release_notes.py med > /tmp/med_notes.md

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per-file isolation: a failed upload must not block the remaining
          # regions' uploads (each asset is independent) — collect failures
          # and fail the job at the END instead of aborting mid-loop.
          failed=0
          for f in ./med-gribs/*.grb2; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            gh release upload med-currents-latest "$f" \
              --clobber \
              --repo "${{ github.repository }}" \
              2>/tmp/gh_upload_err.txt || {
                if grep -qi "release not found" /tmp/gh_upload_err.txt; then
                  echo "Release does not exist — creating..."
                  gh release create med-currents-latest "$f" \
                    --repo "${{ github.repository }}" \
                    --title "Surface Current Forecasts — Mediterranean Sea (Copernicus Marine CMEMS MED)" \
                    --notes-file /tmp/med_notes.md \
                    --latest=false
                else
                  echo "Upload FAILED for $(basename $f):"
                  cat /tmp/gh_upload_err.txt
                  failed=1
                fi
              }
          done
          exit $failed

      # Regenerated from sources/ REGIONS every run so the region table
      # (files, coverage, resolution, horizons) never drifts from what the
      # pipeline actually produces — adding a region updates the release
      # page automatically.
      - name: Update release notes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit med-currents-latest \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — Mediterranean Sea (Copernicus Marine CMEMS MED)" \
            --notes-file /tmp/med_notes.md

      - name: Fail if any region failed to generate
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::One or more regions failed to generate (see the 'Generate MED GRIB2 files' step log). Regions that did generate were still uploaded."
          exit 1

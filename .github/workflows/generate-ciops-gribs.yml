name: Generate ECCC CIOPS Current GRIB2 Files

on:
  schedule:
    # CIOPS runs at 00/06/12/18 UTC and a run's files are complete on the
    # MSC Datamart ~7 h 10 min later — run ~7.5 h after each cycle. The
    # generator picks the newest complete run itself, so a late run just
    # means this pass republishes the previous one.
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ciops-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q numpy netCDF4 eccodes

      # continue-on-error: a region that fails to generate must not block the
      # upload of the regions that succeeded — the job is failed explicitly by
      # the final step instead, so stale assets still turn CI red.
      - name: Generate CIOPS GRIB2 files
        id: generate
        continue-on-error: true
        run: |
          python scripts/tide-current/generate_ciops_gribs.py \
            --output-dir ./ciops-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./ciops-gribs/

      # Built before the upload so a release created on the first run gets
      # the full notes (attribution included) even if a later upload fails.
      - name: Generate release notes
        run: python scripts/tide-current/currents_release_notes.py ciops > /tmp/ciops_notes.md

      # Read the download counts before the upload replaces the files (a
      # replaced asset restarts at 0) and add them to download-stats.json
      # in the release. Never blocks the upload.
      - name: Record download counts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_download_stats.py ciops-currents-latest

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each file is uploaded under a temporary name and swapped in, so a
          # failed upload never removes the live file (`--clobber` deletes the
          # old asset first). Per-file isolation; exit 1 if any file failed.
          python3 scripts/release_upload.py ciops-currents-latest ./ciops-gribs/*.grb2 \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — Canada (ECCC CIOPS)" \
            --notes-file /tmp/ciops_notes.md

      # Regenerated from sources/ REGIONS every run so the region table
      # (files, coverage, resolution, horizons) never drifts from what the
      # pipeline actually produces — adding a region updates the release
      # page automatically.
      - name: Update release notes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit ciops-currents-latest \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — Canada (ECCC CIOPS)" \
            --notes-file /tmp/ciops_notes.md

      - name: Fail if any region failed to generate
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::One or more regions failed to generate (see the 'Generate CIOPS GRIB2 files' step log). Regions that did generate were still uploaded."
          exit 1

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-seo.py'
      - 'tide-current-index.json'
      - 'routing-index.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows:
      - "Generate Routing Index & Coverage Map"
      - "Generate Tide/Current Index"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages artifact & SEO metadata
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp tide-current-index.json _site/
          cp routing-index.json _site/
          python3 scripts/build-seo.py _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

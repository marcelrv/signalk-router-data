name: Generate Routing Index & Coverage Map
on:
  push:
    branches: [main]
    paths:
      - 'regions/**/*.index.json'
      - 'regions/**/*.sqlite.gz'
      - 'regions/**/*.sqlite'
      - 'scripts/generate_index.py'
      - 'scripts/routing_release_notes.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-indexes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-index.txt'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libproj-dev libgeos-dev
          pip install -r scripts/requirements-index.txt

      - name: Generate routing-index.json and coverage-map.png
        run: python scripts/generate_index.py --regions-dir ./regions --output-dir .

      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update routing-index.json and coverage map"
          file_pattern: routing-index.json coverage-map.png

      # Regenerated from routing-index.json every run so the region table on
      # the release page never drifts from the published catalog — deploying a
      # new region updates the release notes automatically. Skipped when the
      # release does not exist yet (no region has been published to it).
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view routing-databases-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release routing-databases-latest does not exist yet — nothing to update."
            exit 0
          fi
          python scripts/routing_release_notes.py --index routing-index.json > /tmp/routing_notes.md
          gh release edit routing-databases-latest \
            --repo "${{ github.repository }}" \
            --title "Routing Databases — Nautical Routing Graphs" \
            --notes-file /tmp/routing_notes.md

name: Generate CMEMS NWS Current GRIB2 Files

on:
  schedule:
    # Once daily — the anfc dataset updates ~12:00 UTC (per the Copernicus
    # Marine product page).
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nws-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q copernicusmarine numpy xarray netCDF4 eccodes

      # continue-on-error: a region that fails to generate must not block the
      # upload of the regions that succeeded — the job is failed explicitly by
      # the final step instead, so stale assets still turn CI red.
      - name: Generate NWS GRIB2 files
        id: generate
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python scripts/tide-current/generate_nws_gribs.py \
            --output-dir ./nws-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./nws-gribs/

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per-file isolation: a failed upload must not block the remaining
          # regions' uploads (each asset is independent) — collect failures
          # and fail the job at the END instead of aborting mid-loop.
          failed=0
          for f in ./nws-gribs/*.grb2; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            gh release upload nws-currents-latest "$f" \
              --clobber \
              --repo "${{ github.repository }}" \
              2>/tmp/gh_upload_err.txt || {
                if grep -qi "release not found" /tmp/gh_upload_err.txt; then
                  echo "Release does not exist — creating..."
                  gh release create nws-currents-latest "$f" \
                    --repo "${{ github.repository }}" \
                    --title "Surface Current Forecasts — UK, Ireland & English Channel (Copernicus Marine CMEMS NWS)" \
                    --notes "(placeholder — the region table is filled in by the 'Update release notes' step below)" \
                    --latest=false
                else
                  echo "Upload FAILED for $(basename $f):"
                  cat /tmp/gh_upload_err.txt
                  failed=1
                fi
              }
          done
          exit $failed

      # Regenerated from sources/ REGIONS every run so the region table
      # (files, coverage, resolution, horizons) never drifts from what the
      # pipeline actually produces — adding a region updates the release
      # page automatically.
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/tide-current/currents_release_notes.py nws > /tmp/nws_notes.md
          gh release edit nws-currents-latest \
            --repo "${{ github.repository }}" \
            --title "Surface Current Forecasts — UK, Ireland & English Channel (Copernicus Marine CMEMS NWS)" \
            --notes-file /tmp/nws_notes.md

      - name: Fail if any region failed to generate
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::One or more regions failed to generate (see the 'Generate NWS GRIB2 files' step log). Regions that did generate were still uploaded."
          exit 1

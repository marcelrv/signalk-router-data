name: Generate CMEMS NWS Current GRIB2 Files

on:
  schedule:
    # Once daily — the anfc dataset updates ~12:00 UTC (per the Copernicus
    # Marine product page).
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nws-gribs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -q copernicusmarine numpy xarray netCDF4 eccodes

      - name: Generate NWS GRIB2 files
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python scripts/tide-current/generate_nws_gribs.py \
            --output-dir ./nws-gribs
          echo "---"
          echo "GRIB2 files:"
          ls -lh ./nws-gribs/

      - name: Upload GRIB2 files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per-file isolation: a failed upload must not block the remaining
          # regions' uploads (each asset is independent) — collect failures
          # and fail the job at the END instead of aborting mid-loop.
          failed=0
          for f in ./nws-gribs/*.grb2; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            gh release upload nws-currents-latest "$f" \
              --clobber \
              --repo "${{ github.repository }}" \
              2>/tmp/gh_upload_err.txt || {
                if grep -qi "release not found" /tmp/gh_upload_err.txt; then
                  echo "Release does not exist — creating..."
                  gh release create nws-currents-latest "$f" \
                    --repo "${{ github.repository }}" \
                    --title "Surface Current Forecasts — UK, Ireland & English Channel (Copernicus Marine CMEMS NWS)" \
                    --notes "Gridded surface current forecasts (tide + weather + river forcing) for the UK, Ireland and English Channel, regenerated daily from the Copernicus Marine Service NWS analysis-and-forecast model (dataset cmems_mod_nws_phy-cur_anfc_1.5km-2D_PT1H-i). Generated using E.U. Copernicus Marine Service Information (https://doi.org/10.48670/moi-00054). NOT an official Copernicus product; not endorsed by the Met Office or Mercator Ocean International. See https://github.com/marcelrv/signalk-router-data/issues/3 for background." \
                    --latest=false
                else
                  echo "Upload FAILED for $(basename $f):"
                  cat /tmp/gh_upload_err.txt
                  failed=1
                fi
              }
          done
          exit $failed

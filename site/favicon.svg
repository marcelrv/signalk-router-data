<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#071524"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Compass ring -->
  <circle cx="32" cy="30" r="20" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.45"/>
  <!-- Cardinal ticks -->
  <line x1="32" y1="7" x2="32" y2="11" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="55" y1="30" x2="51" y2="30" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="9" y1="30" x2="13" y2="30" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Compass needle (North bright cyan, South muted slate) -->
  <polygon points="32,12 38,30 32,27 26,30" fill="url(#north)"/>
  <polygon points="32,48 38,30 32,33 26,30" fill="#64748b"/>
  <circle cx="32" cy="30" r="3" fill="#e6f0fa"/>
  <!-- Subtle ocean wave along bottom -->
  <path d="M10 53 Q18 48 26 53 T42 53 T54 53" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
